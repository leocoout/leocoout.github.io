<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stream for All</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0b0c0e; color: #edeef0;
      font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      max-width: 340px; width: 100%; margin: 24px; padding: 28px; text-align: center;
      background: #121316; border: 1px solid #ffffff14; border-radius: 14px;
    }
    .logo { height: 34px; width: auto; margin: 0 auto 14px; display: block; }
    p { color: #8a8f98; font-size: 14px; line-height: 1.5; margin: 0 0 18px; }
    a.btn {
      display: inline-block; text-decoration: none; padding: 11px 18px; border-radius: 10px;
      background: #edeef0; color: #131519; font-size: 14px; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="logo_dark.png" alt="Stream for All" />
    <p id="msg">Abrindo a sala…</p>
    <a id="store" class="btn" hidden>Instalar a extensão</a>
  </div>
  <script src="app.js"></script>
</body>
</html>
